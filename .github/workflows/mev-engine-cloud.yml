name: MEV Engine Cloud (profit-gated arbitrage, 24/7)

on:
  schedule:
    # Every 4h while each run lives 4h40m: the next trigger queues behind the
    # active run (same concurrency group) and starts the instant it ends =>
    # back-to-back 24/7 coverage, still free on public repos.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long the engine should run (seconds, split across all networks)"
        required: false
        default: "600"
      network:
        description: "Network name, or 'all' for all 5 chains"
        required: false
        default: "all"

concurrency:
  group: mev-engine
  cancel-in-progress: false

jobs:
  engine:
    name: Scan + profit gate + (optional) atomic fire
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      - name: Profit-gate unit tests (gate must pass before any gas is spent)
        run: python -m unittest discover -s tests -t . -v

      - name: Run 24/7 orchestrator (funding watch + auto-deploy + profit-locked fire)
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SLICE_SECONDS: "90"
        run: |
          echo "orchestrator start $(date -u)"
          python -u MONEY_EXTRACTOR_247.py --minutes 265
